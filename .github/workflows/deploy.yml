# Construit le site Shinylive à partir de app.R et le publie sur GitHub Pages.
# Se lance tout seul à chaque modification de la branche main,
# ou à la main depuis l'onglet Actions (bouton « Run workflow »).
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shinylive
            any::shiny
            any::bslib
            any::ggplot2
            any::quadprog

      - name: Construire le site
        shell: Rscript {0}
        run: |
          site <- file.path(Sys.getenv("RUNNER_TEMP"), "site")
          # Titre et icône de l'onglet : ils appartiennent à la page extérieure
          # (index.html), pas à l'appli, donc on les passe ici.
          shinylive::export(".", site, template_params = list(
            title = "Inférence causale",
            include_in_head = '<link rel="icon" type="image/png" href="icone_ehesp.png">'
          ))
          # L'icône doit être servie à la racine du site, à côté de index.html
          if (file.exists("www/icone_ehesp.png")) {
            file.copy("www/icone_ehesp.png", file.path(site, "icone_ehesp.png"), overwrite = TRUE)
          } else {
            warning("www/icone_ehesp.png introuvable : pas d'icône d'onglet")
          }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - id: deployment
        uses: actions/deploy-pages@v4
