# Construit le site Shinylive à partir de app.R et le publie sur GitHub Pages.
# Se lance tout seul à chaque modification de la branche main,
# ou à la main depuis l'onglet Actions (bouton « Run workflow »).
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shinylive
            any::shiny
            any::bslib
            any::ggplot2
            any::DT
            any::leaflet
            any::shinyWidgets
            any::sf
            any::quadprog
            any::readxl

      - name: Construire le site
        shell: Rscript {0}
        run: |
          site <- file.path(Sys.getenv("RUNNER_TEMP"), "site")
          shinylive::export(".", site)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - id: deployment
        uses: actions/deploy-pages@v4
